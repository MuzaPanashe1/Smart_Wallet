name: smart_travel_wallet
description: AI-Powered Multi-Currency Travel Wallet - Cross-Border Traveller App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & networking
  http: ^1.2.0

  # State management
  provider: ^6.1.2

  # Secure storage (JWT tokens)
  flutter_secure_storage: ^9.0.0

  # UI components
  cupertino_icons: ^1.0.6
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Local persistence
  shared_preferences: ^2.2.3

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
